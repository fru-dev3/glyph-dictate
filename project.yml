# Glyph Dictate (formerly Jot) for Mac. The target, Jot.app and bundle id keep the Jot name so installs keep their permissions. Generate the Xcode project with `xcodegen generate` (scripts/install.sh does).
name: Jot
options:
  bundleIdPrefix: dev.fru
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.7.8"
    CURRENT_PROJECT_VERSION: "15"
targets:
  Jot:
    type: application
    platform: macOS
    sources:
      - path: Mac
        excludes: [FnKeyCheck.swift, RulesCheck.swift]
    entitlements:
      path: Mac/JotMac.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fru.jot.mac
        PRODUCT_NAME: Jot
        PRODUCT_MODULE_NAME: JotMac
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Glyph Dictate
        CFBundleName: Glyph Dictate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Glyph Dictate listens while you hold the talk key and types what you say. Nothing leaves this Mac.
